<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Midnight Confectionery</title>
<meta name="description" content="A dark little game about chocolates, monsters, and the bouquet you leave behind.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍫</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&display=swap" rel="stylesheet">
<style>
  :root{
    --cocoa:#1d110a;
    --cocoa-deep:#120a05;
    --cream:#f0e3cf;
    --cream-dim:#c9b79b;
    --foil:#d4a052;
    --foil-dim:rgba(212,160,82,.28);
    --blood:#b03a30;
    --kitkat:#c8102e;
    --dairymilk:#5a3ea6;
    --roses:#d96a8a;
    --dark:#7a2f3c;
    --toffee:#c07f30;
    --eclair:#9a7336;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:17px}
  body{
    min-height:100vh;
    background:
      radial-gradient(120% 90% at 50% -10%, #35200f 0%, var(--cocoa) 45%, var(--cocoa-deep) 100%);
    color:var(--cream);
    font-family:"Fraunces", Georgia, serif;
    font-weight:340;
    line-height:1.65;
    display:flex;
    flex-direction:column;
    align-items:center;
    transition:filter 1.2s ease;
  }
  body.gone{filter:saturate(.35) brightness(.75) sepia(.25)}
  header{
    width:100%;
    max-width:40rem;
    padding:1.4rem 1.2rem .4rem;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:1rem;
  }
  header .mark{
    font-style:italic;
    color:var(--foil);
    font-size:.95rem;
    letter-spacing:.02em;
  }
  header .worth{
    font-size:.85rem;
    color:var(--cream-dim);
    text-align:right;
  }
  header .worth b{color:var(--foil);font-weight:600}
  main{
    width:100%;
    max-width:40rem;
    padding:1.2rem 1.2rem 2rem;
    flex:1;
  }
  h1{
    font-size:clamp(1.9rem, 6vw, 2.6rem);
    font-weight:560;
    font-style:italic;
    color:var(--foil);
    line-height:1.15;
    margin-bottom:.9rem;
    text-wrap:balance;
  }
  .scene p{margin-bottom:1rem;max-width:34rem}
  .scene p.whisper{
    font-style:italic;
    color:var(--cream-dim);
    font-size:.95rem;
  }
  .scene em{color:var(--roses);font-style:italic}
  .scene .danger{color:var(--blood)}
  .fade > *{animation:rise .7s ease both}
  .fade > *:nth-child(2){animation-delay:.12s}
  .fade > *:nth-child(3){animation-delay:.24s}
  .fade > *:nth-child(4){animation-delay:.36s}
  .fade > *:nth-child(5){animation-delay:.48s}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){
    .fade > *{animation:none}
    body{transition:none}
  }

  .choices{margin-top:1.6rem;display:flex;flex-direction:column;gap:.6rem;max-width:34rem}
  button{
    font:inherit;
    color:inherit;
    cursor:pointer;
  }
  .choice{
    text-align:left;
    background:transparent;
    border:1px solid var(--foil-dim);
    border-radius:.35rem;
    padding:.75rem 1rem;
    transition:background .18s ease, border-color .18s ease;
  }
  .choice:hover,.choice:focus-visible{
    background:rgba(212,160,82,.1);
    border-color:var(--foil);
    outline:none;
  }
  .choice small{display:block;color:var(--cream-dim);font-size:.82rem;font-style:italic}

  /* chocolate chips */
  .tray{
    margin-top:1.4rem;
    display:flex;
    flex-wrap:wrap;
    gap:.55rem;
    max-width:34rem;
  }
  .chip{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:.1rem;
    background:rgba(0,0,0,.35);
    border:1px solid var(--foil-dim);
    border-left:.45rem solid var(--wrap, var(--foil));
    border-radius:.4rem;
    padding:.5rem 3.4rem .55rem .8rem;
    min-width:9.2rem;
    transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .chip b{font-weight:560;font-size:.98rem}
  .chip span{font-size:.78rem;color:var(--cream-dim);font-style:italic}
  .chip .pts{
    position:absolute;top:.45rem;right:.6rem;
    font-size:.75rem;color:var(--foil);font-style:normal;
  }
  .chip.selectable:hover,.chip.selectable:focus-visible{
    transform:translateY(-2px);
    border-color:var(--foil);
    outline:none;
  }
  .chip.selected{
    border-color:var(--foil);
    box-shadow:0 0 0 1px var(--foil), 0 6px 18px rgba(0,0,0,.5);
    transform:translateY(-2px);
  }
  .tray-actions{margin-top:1rem;display:flex;gap:.6rem;flex-wrap:wrap}
  .act{
    background:var(--foil);
    color:var(--cocoa-deep);
    border:none;
    border-radius:.35rem;
    padding:.6rem 1.2rem;
    font-weight:600;
  }
  .act:disabled{opacity:.35;cursor:default}
  .act.ghost{background:transparent;color:var(--cream-dim);border:1px solid var(--foil-dim);font-weight:400}
  .act.ghost:hover{color:var(--cream)}

  /* bouquet */
  .bouquet{
    margin:1.8rem auto 0;
    max-width:30rem;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .stems{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    min-height:7.5rem;
  }
  .stem{
    width:6.4rem;
    padding:.55rem .5rem 1.05rem;
    text-align:center;
    background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(0,0,0,.25));
    border:1px solid var(--foil-dim);
    border-top:.4rem solid var(--wrap, var(--foil));
    border-radius:3rem 3rem .5rem .5rem;
    margin:0 -.45rem;
    transform:rotate(var(--tilt)) translateY(var(--lift));
    font-size:.74rem;
    line-height:1.25;
  }
  .stem b{display:block;font-size:.82rem;font-weight:560}
  .stem i{color:var(--foil);font-style:normal}
  .wrapcone{
    width:11rem;height:3.6rem;
    margin-top:.2rem;
    align-items:flex-start;
    padding-top:.5rem;
    background:linear-gradient(180deg,#3a2413,#241408);
    border:1px solid var(--foil-dim);
    clip-path:polygon(0 0, 100% 0, 62% 100%, 38% 100%);
    display:flex;align-items:center;justify-content:center;
    color:var(--foil);font-style:italic;font-size:.8rem;
  }
  .empty-bouquet{color:var(--cream-dim);font-style:italic;text-align:center;margin-top:1.4rem}
  .tally{
    margin-top:1.6rem;text-align:center;
  }
  .tally .num{font-size:2.2rem;color:var(--foil);font-weight:600;font-style:italic}
  .tally .grade{color:var(--cream-dim);font-style:italic}
  .tally .best{font-size:.8rem;color:var(--cream-dim);margin-top:.4rem}

  /* the walker */
  #floorwrap{width:100%;max-width:40rem;padding:0 1.2rem}
  #floor{display:block;width:100%;height:150px}
  .choice.near{background:rgba(212,160,82,.1);border-color:var(--foil)}

  footer{
    width:100%;max-width:40rem;
    padding:0 1.2rem 1.6rem;
    font-size:.78rem;color:rgba(201,183,155,.55);
    font-style:italic;
    display:flex;justify-content:space-between;gap:1rem;
  }
  footer a{color:inherit}
  @media (max-width:480px){
    html{font-size:15.5px}
    .chip{min-width:100%}
    .stem{width:5.6rem}
  }
</style>
</head>
<body>
<header>
  <div class="mark">The Midnight Confectionery</div>
  <div class="worth" id="worth"></div>
</header>
<div id="floorwrap"><canvas id="floor" aria-hidden="true"></canvas></div>
<main id="stage" aria-live="polite"></main>
<footer>
  <span>a small dark game</span>
  <a href="/">kushalsubedi.github.io</a>
</footer>

<script>
"use strict";

/* ---------- data ---------- */

const ITEMS = {
  kitkat:    { name:"KitKat",       pts:20, wrap:"var(--kitkat)",    desc:"Four wafer fingers. They want to snap." },
  dairymilk: { name:"Dairy Milk",   pts:15, wrap:"var(--dairymilk)", desc:"Sweet milk chocolate. Tastes like being a kid." },
  roses:     { name:"Cadbury Roses",pts:25, wrap:"var(--roses)",     desc:"The box you give when you can't find words." },
  dark:      { name:"Bournville 85%",pts:30,wrap:"var(--dark)",      desc:"Very dark. Very honest." },
  toffee:    { name:"Old Toffee",   pts:10, wrap:"var(--toffee)",    desc:"Old and sticky. It never lets go." },
  eclair:    { name:"Cadbury Eclair",pts:12,wrap:"var(--eclair)",    desc:"Hard outside, caramel inside." },
  /* craftables */
  caramelheart:{ name:"Caramel Heart",pts:30, wrap:"var(--toffee)",  desc:"Warm and sticky. It holds on to what it loves.", crafted:true },
  bitterlance: { name:"Bitter Lance", pts:55, wrap:"var(--dark)",    desc:"A sharp blade of wafer and dark chocolate.", crafted:true },
  velvetrose:  { name:"Velvet Rose",  pts:50, wrap:"var(--roses)",   desc:"A soft chocolate rose. Too pretty to eat.", crafted:true },
};

const MIXES = {
  "dairymilk+toffee": "caramelheart",
  "dark+kitkat":      "bitterlance",
  "dairymilk+roses":  "velvetrose",
};

const HALL_POOL   = ["kitkat","dairymilk","roses"];
const CELLAR_POOL = ["dark","toffee","eclair"];

/* ---------- state ---------- */

let S;
function reset(){
  S = { inv:[], taken:new Set(), flags:{}, grace:0, wounds:0 };
  go("intro");
}
const has = id => S.inv.includes(id);
const lose = id => { const i=S.inv.indexOf(id); if(i>-1) S.inv.splice(i,1); };
const gain = id => { S.inv.push(id); S.taken.add(id); };
const score = () => S.inv.reduce((s,i)=>s+ITEMS[i].pts,0) + S.grace - S.wounds;
const mixKey = (a,b) => [a,b].sort().join("+");

/* ---------- rendering helpers ---------- */

const stage = document.getElementById("stage");
const worthEl = document.getElementById("worth");
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

function updateWorth(){
  worthEl.innerHTML = S.inv.length
    ? `your bouquet — <b>${score()} pts</b> · ${S.inv.length} sweet${S.inv.length>1?"s":""}`
    : `your hands are empty`;
}

function paras(arr){ return arr.map(t=>`<p${t.startsWith("~")?' class="whisper"':""}>${t.replace(/^~/,"")}</p>`).join(""); }

function render(title, textArr, extraHTML=""){
  updateWorth();
  stage.innerHTML = `<div class="scene fade"><h1>${title}</h1>${paras(textArr)}${extraHTML}</div>`;
  window.scrollTo({top:0});
  walkerScene();
}

function choices(list){
  return `<div class="choices">` + list.map((c,i)=>
    `<button class="choice" data-c="${i}">${c.label}${c.sub?`<small>${c.sub}</small>`:""}</button>`
  ).join("") + `</div>`;
}
function bindChoices(list){
  stage.querySelectorAll("[data-c]").forEach(btn=>{
    btn.addEventListener("click", ()=> list[+btn.dataset.c].act());
  });
}

function chipHTML(id, selectable){
  const it = ITEMS[id];
  return `<button class="chip ${selectable?"selectable":""}" data-id="${id}" style="--wrap:${it.wrap}">
    <b>${it.name}</b><span>${it.desc}</span><span class="pts">${it.pts} pts</span>
  </button>`;
}

/* generic picker: choose up to n items from pool, then cont(pickedIds) */
function picker(pool, n, verb, cont, skipLabel){
  const sel = new Set();
  const trayHTML = `<div class="tray">${pool.map(id=>chipHTML(id,true)).join("")}</div>
    <div class="tray-actions">
      <button class="act" id="confirm" disabled>${verb}</button>
      ${skipLabel?`<button class="act ghost" id="skip">${skipLabel}</button>`:""}
    </div>`;
  return { html:trayHTML, bind(){
    const confirm = stage.querySelector("#confirm");
    stage.querySelectorAll(".chip").forEach(ch=>{
      ch.addEventListener("click", ()=>{
        const id = ch.dataset.id;
        if(sel.has(id)){ sel.delete(id); ch.classList.remove("selected"); }
        else if(sel.size < n){ sel.add(id); ch.classList.add("selected"); }
        confirm.disabled = sel.size===0;
        confirm.textContent = `${verb}${sel.size>1?` (${sel.size})`:""}`;
      });
    });
    confirm.addEventListener("click", ()=> cont([...sel]));
    const skip = stage.querySelector("#skip");
    if(skip) skip.addEventListener("click", ()=> cont([]));
  }};
}

/* ---------- fights ----------
   outcomes: map itemId -> {type:'kill'|'escape'|'death', text, consume?, wound?}
   two selected chips are mixed first; unknown mix = sludge (lose both, one more chance) */

function fight(cfg){
  render(cfg.title, cfg.text,
    `<p class="whisper">Give it one thing — or pick two to mix. Walk to a sweet, press E, then ring the Offer bell.</p>
     <div class="tray">${S.inv.map(id=>chipHTML(id,true)).join("")}</div>
     <div class="tray-actions"><button class="act" id="offer" disabled>Offer</button></div>`);
  W2.monster = cfg.monster || null;
  layoutMarkers();

  const sel = new Set();
  const offer = stage.querySelector("#offer");
  stage.querySelectorAll(".chip").forEach(ch=>{
    ch.addEventListener("click", ()=>{
      const id = ch.dataset.id;
      if(sel.has(id)){ sel.delete(id); ch.classList.remove("selected"); }
      else if(sel.size<2){ sel.add(id); ch.classList.add("selected"); }
      offer.disabled = sel.size===0;
      offer.textContent = sel.size===2 ? "Mix & offer" : "Offer";
    });
  });

  offer.addEventListener("click", ()=>{
    let used = [...sel];
    let itemId;
    if(used.length===2){
      const result = MIXES[mixKey(used[0],used[1])];
      if(result){
        used.forEach(lose);
        gain(result);
        itemId = result;
      } else {
        used.forEach(lose);
        if(S.inv.length===0) return die(cfg.title,
          ["You press the two sweets together. They refuse each other — a grey, weeping sludge runs through your fingers.",
           "Your hands are empty now. "+cfg.sludgeDeath]);
        return fightInterlude(cfg,
          ["You press the two sweets together. They refuse each other — a grey, weeping sludge runs through your fingers.",
           "~"+cfg.sludgeTaunt]);
      }
    } else {
      itemId = used[0];
    }
    resolve(cfg, itemId);
  });
}

function fightInterlude(cfg, text){
  render(cfg.title, text, choices([{label:"Take a breath and choose again.", act:()=>fight(cfg)}]));
  bindChoices([{act:()=>fight(cfg)}]);
}

function resolve(cfg, itemId){
  const out = cfg.outcomes[itemId] || cfg.fallback;
  if(out.consume !== false) lose(itemId);
  if(out.wound) S.wounds += out.wound;
  if(out.type==="death") return die(cfg.title, out.text);
  render(cfg.title, out.text, choices([{label:out.next.label, act:out.next.act}]));
  bindChoices([{act:out.next.act}]);
}

/* ---------- endings ---------- */

function bouquetHTML(caption){
  if(S.inv.length===0) return `<p class="empty-bouquet">There is no bouquet. Your hands were empty.</p>`;
  const n = S.inv.length;
  const stems = S.inv.map((id,i)=>{
    const it = ITEMS[id];
    const tilt = (i-(n-1)/2)*9;
    const lift = Math.abs(i-(n-1)/2)*9;
    return `<div class="stem" style="--wrap:${it.wrap};--tilt:${tilt}deg;--lift:${lift}px"><b>${it.name}</b><i>${it.pts} pts</i></div>`;
  }).join("");
  return `<div class="bouquet"><div class="stems">${stems}</div><div class="wrapcone">${caption}</div></div>`;
}

function grade(p){
  if(p>=120) return "A bouquet worth dying for. You almost did.";
  if(p>=80)  return "A beautiful bouquet.";
  if(p>=45)  return "A small, honest bouquet.";
  if(p>0)    return "A little bouquet. Little things still count.";
  return "Nothing but the walk.";
}

function tallyHTML(label){
  const p = score();
  const best = +(localStorage.getItem("confectionery-best")||0);
  if(p>best) localStorage.setItem("confectionery-best", p);
  return `<div class="tally">
    <div class="num">${p} pts</div>
    <div class="grade">${grade(p)}</div>
    ${best>0?`<div class="best">best walk so far: ${Math.max(best,p)} pts</div>`:""}
  </div>
  <div class="tray-actions" style="justify-content:center;margin-top:1.6rem">
    <button class="act" id="again">${label}</button>
  </div>`;
}

function die(where, text){
  document.body.classList.add("gone");
  const t = Array.isArray(text)?text:[text];
  render("You are gone.", [
    ...t,
    "The shop folds itself around the spot where you stood, and goes quiet.",
    "~But in the morning, someone finds what you were carrying, laid out like a gift:"
  ], bouquetHTML("left behind") + tallyHTML("Walk again"));
  stage.querySelector("#again").addEventListener("click", ()=>{
    document.body.classList.remove("gone");
    reset();
  });
}

function ending(kind){
  if(kind==="lance"){
    render("The Last Counter", [
      "Behind where he stood there is no door. There is a small garden under a paper moon, and in the garden, a small white stone.",
      "You kneel to put the bouquet down, and read the name on the stone.",
      "<em>It is your name.</em>",
      "~This shop is where the gone ones come to build their own goodbyes. Yours was beautiful.",
    ], bouquetHTML("laid on the stone") + tallyHTML("Walk again"));
  } else if(kind==="child"){
    S.grace += 25;
    render("The Hollow Child", [
      "You stand still with empty hands. The Confectioner lifts the ladle — and stops.",
      "The Hollow Child is standing between you. It holds up the chocolate you gave it. Not eaten. Kept.",
      "<em>\"This one shares,\"</em> the child says. The Confectioner lowers his arm, and the whole house sighs and lets you through.",
      "The garden. The paper moon. The white stone with your name on it. You put the bouquet down anyway.",
      "~Kindness is the rarest ingredient. +25 pts.",
    ], bouquetHTML("laid on the stone") + tallyHTML("Walk again"));
  }
  stage.querySelector("#again").addEventListener("click", reset);
}

/* ---------- scenes ---------- */

const SCENES = {

intro(){
  render("The Midnight Confectionery", [
    "You wake up standing in a dark chocolate shop. The shop is closed. You don't know how you got here.",
    "Tall shelves full of chocolate shine in the dark.",
    "On the counter there is a card: <em>\"Build a bouquet for the one who waits at the end. Pick with care. Some of this is food. Some of it is a weapon.\"</em>",
    "~Deep in the shop, something licks its lips.",
  ], choices(C.intro));
  bindChoices(C.intro);
},

doors(){
  render("Two Doors", [
    "Past the counter the shop splits into two doors. Both are open a little.",
    "The left door is <em>warm</em>. It smells like milk and caramel.",
    "The right door is <em>cold</em>. It smells like dark chocolate and rain.",
    "~The door you pick says something about you. The shop is listening.",
  ], choices(C.doors));
  bindChoices(C.doors);
},

hall(){
  const pool = HALL_POOL.filter(id=>!S.taken.has(id));
  const p = picker(pool, 2, "Take", picked=>{ picked.forEach(gain); go("vendor"); });
  render("The Foil Hall", [
    "Warm golden light. These shelves hold the happy chocolates — the kind you get on birthdays.",
    "A brass sign says: <em>\"TAKE TWO ONLY. The hall is counting.\"</em>",
    "~Walk to a chocolate and press E to pick it up. Then ring the bell. (Clicking works too.)",
  ], p.html);
  p.bind();
},

cellar(){
  const pool = CELLAR_POOL.filter(id=>!S.taken.has(id));
  const p = picker(pool, 2, "Take", picked=>{ picked.forEach(gain); go("vendor"); });
  render("The Cellar", [
    "Cold steps go down. These shelves hold the serious chocolates — dark, bitter, and hard.",
    "Chalk on the wall says: <em>\"TAKE TWO ONLY. The cellar is counting.\"</em>",
    "~Walk to a chocolate and press E to pick it up. Then ring the bell.",
  ], p.html);
  p.bind();
},

vendor(){
  render("The Counter of Small Mercies", [
    "A small window opens in the wall. Behind it is a face made of old crumpled wrappers. It smiles at you.",
    "<em>\"Answer my riddle and you can take one sweet from the other room. For free.\"</em>",
    "The face leans close: <em>\"People give me when they cannot find words. I live longer than the one who gives me. What am I?\"</em>",
  ], choices(C.vendorRiddle));
  bindChoices(C.vendorRiddle);
},

vendorFail(){
  render("The Counter of Small Mercies", [
    `<span class="danger">"Wrong,"</span> says the wrapper face. <em>"It was a rose. It is always a rose."</em>`,
    "The window slams shut. Your chance is gone.",
  ], choices(C.onward));
  bindChoices(C.onward);
},

vendorWin(){
  const other = (S.flags.door==="hall" ? CELLAR_POOL : HALL_POOL).filter(id=>!S.taken.has(id));
  const p = picker(other, 1, "Take", picked=>{ picked.forEach(gain); go("wraith"); }, "Take nothing");
  render("The Counter of Small Mercies", [
    "<em>\"A rose,\"</em> the face sighs, happy. <em>\"It is always a rose.\"</em>",
    "The window opens wide. Inside are the shelves of the room you did not pick.",
    "~Take one. Only one.",
  ], p.html);
  p.bind();
},

wraith(){
  fight({
    title:"The Sugar Wraith",
    monster:"wraith",
    text:[
      "The hall turns white — not clean white, <em>icing</em> white. The air smells like a hundred birthdays at once.",
      "A monster made of spun sugar drops from the ceiling. It has no face. Only a mouth. The mouth says, politely, <span class='danger'>\"sweet?\"</span>",
      "~It eats sweet things. Think about that before you feed it.",
    ],
    sludgeTaunt:`"sweet?" the Wraith asks again. It sounds angry now.`,
    sludgeDeath:"The Wraith does not ask a third time.",
    outcomes:{
      dark:{ type:"kill", consume:false,
        text:[
          "You hold out the dark chocolate. The Wraith drinks it — and shakes. Too bitter.",
          "<em>\"oh,\"</em> it says, and falls apart into a soft rain of sugar.",
          "Your bar is fine. It only took a sip.",
        ],
        next:{ label:"Walk on through the falling sugar.", act:()=>go("spill") } },
      bitterlance:{ type:"kill",
        text:[
          "You mix the snap and the bitter right there, and stab the Bitter Lance into the mouth.",
          "The Wraith falls apart like candy floss in rain. The Lance breaks too — it only works once.",
          "~You used your best weapon early. The house is counting.",
        ],

function go(id){ SCENES[id](); }

/* ---------- the walker: your little self on the shop floor ----------
   ←/→ or A/D walk, SPACE jumps, E (or W/↑) uses the thing you stand at:
   doors = choices, chocolates = pick/unpick, bells = confirm buttons.
   Everything mirrors the real buttons, which stay clickable. */

const cv = document.getElementById("floor"), ctx = cv.getContext("2d");
const FH = 150, FOIL = "#d4a052";
const W2 = { x:36, dir:1, tx:null, goal:-1, near:-1, moving:false, markers:[], jy:0, vy:0, monster:null };
let CW = 0;
const CSSC = {};
const cssc = v => {
  const n = v.match(/--[\w-]+/)[0];
  return CSSC[n] ??= getComputedStyle(document.documentElement).getPropertyValue(n).trim();
};

function sizeCanvas(){
  const w = cv.clientWidth, dpr = devicePixelRatio || 1;
  if(w === CW || !w) return;
  CW = w;
  cv.width = w*dpr; cv.height = FH*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  layoutMarkers();
}

function layoutMarkers(){
  const els = [...stage.querySelectorAll(".choice, .chip.selectable, .act")];
  const span = CW - (W2.monster ? 110 : 0);
  W2.markers = els.map((b,i)=>{
    const kind = b.classList.contains("chip") ? "choc" : b.classList.contains("act") ? "bell" : "door";
    let label = "";
    if(kind==="choc"){
      label = b.querySelector("b").textContent + " · " + b.querySelector(".pts").textContent;
    } else if(kind==="door"){
      const sm = b.querySelector("small");
      label = (sm ? b.textContent.replace(sm.textContent,"") : b.textContent).trim();
    }
    return { x: Math.max(30, span*(i+1)/(els.length+1)), btn:b, kind, label,
      color: kind==="choc" ? cssc(b.style.getPropertyValue("--wrap")) : null };
  });
}

function walkerScene(){
  sizeCanvas();
  W2.monster = null;
  layoutMarkers();
  W2.x = 26; W2.dir = 1; W2.goal = -1;
  W2.tx = Math.min(90, CW/4); // step into the room
}

const P = [];
function burst(x,y,c){
  for(let i=0;i<10;i++) P.push({x,y,vx:(Math.random()-.5)*3,vy:-1-Math.random()*2.5,c,l:1});
}
function useMarker(m){
  burst(m.x, FH-56, m.kind==="choc" ? m.color : FOIL);
  m.btn.click();
}

const KEYS = {};
addEventListener("keydown", e=>{
  const k = e.key.toLowerCase();
  if(k==="arrowleft"||k==="arrowright"||k==="a"||k==="d"){ KEYS[k]=true; e.preventDefault(); }
  if(k===" "){ e.preventDefault(); if(W2.jy<=0){ W2.jy = 0.01; W2.vy = 8; } }
  if((k==="e"||k==="w"||k==="arrowup") && W2.near>-1){
    e.preventDefault();
    useMarker(W2.markers[W2.near]);
  }
});
addEventListener("keyup", e=>{ KEYS[e.key.toLowerCase()]=false; });

/* tap the floor to walk there; tap a door to walk there and enter */
cv.addEventListener("pointerdown", e=>{
  W2.tx = e.offsetX;
  W2.goal = W2.markers.findIndex(m=>Math.abs(m.x-e.offsetX)<30);
});

let lastT = 0;
function loop(t){
  requestAnimationFrame(loop);
  const dt = Math.min(32, t-lastT); lastT = t;
  sizeCanvas();
  if(!CW || !S) return;

  let vx = 0;
  if(KEYS["arrowleft"]||KEYS["a"]) vx = -1;
  if(KEYS["arrowright"]||KEYS["d"]) vx = 1;
  if(vx){ W2.tx = null; W2.goal = -1; }
  else if(W2.tx != null){
    const d = W2.tx - W2.x;
    if(Math.abs(d) > 3) vx = Math.sign(d);
    else {
      W2.tx = null;
      if(W2.goal > -1 && W2.markers[W2.goal]) useMarker(W2.markers[W2.goal]);
      W2.goal = -1;
    }
  }
  if(vx) W2.dir = vx;
  W2.moving = !!vx;
  W2.x = Math.max(18, Math.min(CW-18, W2.x + vx*dt*0.22));
  if(W2.jy > 0){
    W2.jy += W2.vy*dt/16;
    W2.vy -= 0.6*dt/16;
    if(W2.jy <= 0){ W2.jy = 0; W2.vy = 0; }
  }

  W2.near = W2.markers.findIndex(m=>Math.abs(m.x-W2.x)<34);
  W2.markers.forEach((m,i)=>m.btn.classList.toggle("near", i===W2.near));
  draw(t);
}

function door(x,y,w,h){
  ctx.beginPath();
  ctx.moveTo(x, y+h); ctx.lineTo(x, y+14);
  ctx.quadraticCurveTo(x, y, x+w/2, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+14);
  ctx.lineTo(x+w, y+h); ctx.closePath();
}

function draw(t){
  ctx.clearRect(0,0,CW,FH);
  const fy = FH-26;

  // floor
  ctx.fillStyle = "rgba(212,160,82,.05)";
  for(let x=0; x<CW; x+=32) if((x/32)%2===0) ctx.fillRect(x,fy+1,32,25);
  ctx.strokeStyle = "rgba(212,160,82,.3)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0,fy+.5); ctx.lineTo(CW,fy+.5); ctx.stroke();

  ctx.textAlign = "center";
  if(W2.markers.length){
    ctx.fillStyle = "rgba(201,183,155,.4)";
    ctx.font = "italic 11px Fraunces, serif";
    ctx.textAlign = "left";
    ctx.fillText("← → walk · E = take / open · space = jump", 4, 14);
    ctx.textAlign = "center";
  }

  drawMonster(t, fy);

  // doors, chocolates, bells
  W2.markers.forEach((m,i)=>{
    const near = i===W2.near;
    if(m.kind==="door"){
      ctx.globalAlpha = near ? 1 : .5 + .12*Math.sin(t/400+i*2);
      ctx.fillStyle = "#2b1a0d"; ctx.strokeStyle = FOIL; ctx.lineWidth = 1;
      door(m.x-16, fy-44, 32, 44);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = FOIL;
      ctx.font = "italic 13px Fraunces, serif";
      ctx.fillText(near ? "E" : i+1, m.x, fy-17);
    } else if(m.kind==="choc"){
      const sel = m.btn.classList.contains("selected");
      const by = fy - 7 - (sel ? 10 + Math.sin(t/300)*2 : 0);
      ctx.globalAlpha = near || sel ? 1 : .8;
      if(sel){ ctx.shadowColor = FOIL; ctx.shadowBlur = 10; }
      ctx.fillStyle = m.color || FOIL;
      ctx.beginPath(); ctx.roundRect(m.x-9, by-6, 18, 12, 3); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "rgba(255,255,255,.45)"; // foil twists
      ctx.beginPath();
      ctx.moveTo(m.x-9, by); ctx.lineTo(m.x-14, by-5); ctx.lineTo(m.x-14, by+5); ctx.closePath();
      ctx.moveTo(m.x+9, by); ctx.lineTo(m.x+14, by-5); ctx.lineTo(m.x+14, by+5); ctx.closePath();
      ctx.fill();
    } else { // bell
      const dis = m.btn.disabled;
      ctx.globalAlpha = dis ? .3 : near ? 1 : .75;
      ctx.fillStyle = "#2b1a0d"; ctx.strokeStyle = FOIL; ctx.lineWidth = 1;
      ctx.fillRect(m.x-13, fy-8, 26, 8); ctx.strokeRect(m.x-13, fy-8, 26, 8);
      ctx.beginPath(); ctx.arc(m.x, fy-8, 10, Math.PI, 0); ctx.closePath();
      ctx.fillStyle = near && !dis ? FOIL : "#8a6a3a"; ctx.fill();
      ctx.fillStyle = near && !dis ? "#f0e3cf" : "rgba(201,183,155,.7)";
      ctx.font = "italic 11.5px Fraunces, serif";
      ctx.fillText(m.btn.textContent.trim(), m.x, fy-24);
    }
    ctx.globalAlpha = 1;
    if(near && m.label){
      ctx.fillStyle = "#f0e3cf";
      ctx.font = "italic 12.5px Fraunces, serif";
      const lbl = m.label.length>40 ? m.label.slice(0,38)+"…" : m.label;
      ctx.fillText(lbl, Math.max(70, Math.min(CW-70, m.x)), fy-54);
    }
  });

  // sparkles
  for(let i=P.length-1; i>=0; i--){
    const p = P[i];
    p.x += p.vx; p.y += p.vy; p.vy += .12; p.l -= .025;
    if(p.l<=0){ P.splice(i,1); continue; }
    ctx.globalAlpha = p.l;
    ctx.fillStyle = p.c;
    ctx.fillRect(p.x-1.5, p.y-1.5, 3, 3);
  }
  ctx.globalAlpha = 1;

  // shadow + the walker
  ctx.fillStyle = "rgba(0,0,0,.35)";
  ctx.beginPath(); ctx.ellipse(W2.x, fy+2, Math.max(4, 10-W2.jy*.08), 3, 0, 0, 7); ctx.fill();
  const step = W2.moving ? Math.sin(t/80)*6 : 0;
  const bob  = W2.moving ? Math.abs(Math.cos(t/80))*1.5 : Math.sin(t/700)*1.2;
  ctx.save();
  ctx.translate(W2.x, fy - W2.jy);
  ctx.scale(W2.dir, 1);
  ctx.lineCap = "round";
  // legs
  ctx.strokeStyle = "#3a2413"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(0,-19); ctx.lineTo(step, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-19); ctx.lineTo(-step, 0); ctx.stroke();
  // coat
  ctx.fillStyle = "#4a2e16";
  ctx.strokeStyle = "rgba(212,160,82,.5)"; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.roundRect(-8, -40+bob, 16, 23, 5);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = FOIL; // buttons
  ctx.beginPath(); ctx.arc(3,-33+bob,1.2,0,7); ctx.arc(3,-27+bob,1.2,0,7); ctx.fill();
  // back arm
  ctx.strokeStyle = "#4a2e16"; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(-4,-36+bob); ctx.lineTo(-7+step*.4, -25+bob); ctx.stroke();
  // head
  ctx.fillStyle = "#e8d5b5";
  ctx.beginPath(); ctx.arc(0, -47+bob, 8, 0, 7); ctx.fill();
  ctx.fillStyle = "#241408"; // hair
  ctx.beginPath(); ctx.arc(0, -49+bob, 8, Math.PI*1.05, Math.PI*1.95); ctx.fill();
  ctx.beginPath(); ctx.arc(3.2, -47.5+bob, 1.1, 0, 7); ctx.fill(); // eye
  // scarf
  ctx.fillStyle = FOIL;
  ctx.fillRect(-7, -41+bob, 14, 4);
  ctx.fillRect(-9+step*.3, -40+bob, 4, 9);
  // front arm + bouquet
  ctx.strokeStyle = "#4a2e16"; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(4,-36+bob); ctx.lineTo(10, -27+bob); ctx.stroke();
  const inv = S.inv.slice(0,7), hx = 10, hy = -27+bob;
  inv.forEach((id,i)=>{
    const a = (inv.length===1 ? 0 : -0.55 + i*1.1/(inv.length-1));
    const tx = hx + Math.sin(a)*15, ty = hy - Math.cos(a)*15;
    ctx.strokeStyle = "rgba(212,160,82,.7)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(tx,ty); ctx.stroke();
    ctx.fillStyle = cssc(ITEMS[id].wrap);
    ctx.beginPath(); ctx.arc(tx,ty,3,0,7); ctx.fill();
  });
  ctx.restore();
}

function drawMonster(t, fy){
  if(!W2.monster) return;
  const mx = CW-55, sway = Math.sin(t/500)*4;
  if(W2.monster==="wraith"){
    ctx.fillStyle = "rgba(240,236,255,.12)";
    ctx.strokeStyle = "rgba(240,236,255,.4)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(mx-24, fy);
    ctx.bezierCurveTo(mx-30+sway, fy-60, mx-10+sway, fy-105, mx+sway, fy-100);
    ctx.bezierCurveTo(mx+14+sway, fy-105, mx+30+sway, fy-55, mx+22, fy);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "rgba(20,8,4,.9)";
    ctx.beginPath(); ctx.ellipse(mx+sway, fy-72, 8, 11+Math.sin(t/300)*3, 0, 0, 7); ctx.fill();
  } else if(W2.monster==="maw"){
    ctx.fillStyle = "rgba(240,227,207,.85)";
    for(let i=0;i<5;i++){
      const tx = CW-95+i*20, h = 16 + (i%2)*7 + Math.sin(t/400+i)*2;
      ctx.beginPath(); ctx.moveTo(tx,fy); ctx.lineTo(tx+8,fy-h); ctx.lineTo(tx+16,fy); ctx.closePath(); ctx.fill();
    }
  } else if(W2.monster==="conf"){
    ctx.fillStyle = "#1a0f07"; ctx.strokeStyle = "rgba(212,160,82,.45)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(mx-14, fy-95+sway*.5, 28, 95, 6); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "rgba(212,160,82,.25)";
    ctx.beginPath(); ctx.moveTo(mx-10, fy-60); ctx.lineTo(mx+10, fy-60); ctx.lineTo(mx+7, fy-8); ctx.lineTo(mx-7, fy-8); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#cbb591";
    ctx.beginPath(); ctx.arc(mx, fy-104+sway*.5, 9, 0, 7); ctx.fill();
    ctx.strokeStyle = "#1a0f07"; ctx.lineWidth = 4; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(mx-12, fy-85); ctx.lineTo(mx-34, fy-100+sway); ctx.stroke();
    ctx.fillStyle = "#5a3a1a";
    ctx.beginPath(); ctx.arc(mx-38, fy-102+sway, 6, 0, 7); ctx.fill();
  }
}
requestAnimationFrame(loop);

reset();
</script>
